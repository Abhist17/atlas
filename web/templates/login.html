<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Sign in</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">📈 Atlas<span class="dot">.</span></div>
      <div class="sub">Intraday NSE stock screener</div>
      <form method="post" action="/login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <button class="btn" type="submit">Sign in</button>
      </form>
      <div class="switch">New here? <a href="/signup">Create an account</a></div>
      <div class="disclaimer">
        Atlas is a decision-support tool for educational use. Signals do not
        predict the market and are not investment advice. Trade at your own risk.
      </div>
    </div>
  </div>
</body>
</html>
